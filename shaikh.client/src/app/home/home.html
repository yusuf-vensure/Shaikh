<div class="popup-overlay" *ngIf="showPopup">
  <div class="popup-card">

    <h1>Welcome!</h1>

    <p class="description">
      Before you get to know about me, I would like to know who you are.
      Please select the option that best describes you:
    </p>

    <div class="option-container">
      <button class="option-btn" (click)="selectRole('Recruiter')">
        Recruiter
      </button>

      <button class="option-btn" (click)="selectRole('Colleague')">
        Colleague
      </button>

      <button class="option-btn" (click)="selectRole('Friend/Classmate')">
        Friend/Classmate
      </button>

      <button class="option-btn" (click)="selectRole('NPC')">
        NPC
      </button>
    </div>

  </div>
</div>
